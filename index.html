<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GE_9.site</title>

<link rel="stylesheet" href="uifx.css"></head>

<body>

    <main class="login-page">

        <!-- Characters -->
        <section class="characters">

            <div class="character green">
                <div class="eyes">
                    <span class="eye left"></span>
                    <span class="eye right"></span>
                </div>
            </div>

            <div class="character blue">
                <div class="eyes">
                    <span class="eye left"></span>
                    <span class="eye right"></span>
                </div>
            </div>

            <div class="character yellow">
                <div class="eye"></div>
                <div class="mouth"></div>
            </div>

            <div class="character orange">
                <div class="eyes">
                    <span class="eye left"></span>
                    <span class="eye right"></span>
                </div>

                <div class="mouth"></div>
            </div>

        </section>


        <!-- Login Card -->
        <section class="login-card">

            <div class="logo">Hi!!!</div>

            <h1>Welcome back</h1>

            <p class="subtitle">
                Please enter your details...
            </p>


            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="off"
            >


            <label for="password">Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

                <button
                    type="button"
                    id="togglePassword"
                    aria-label="Show password">
                    👁
                </button>

            </div>


            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember for 30 days
                </label>

                <button class="forgot">
                    Forgot password?
                </button>

            </div>


            <button
                type="button"
                id="loginButton"
                class="login-button">
                Log In
            </button>


            <button class="google-button">
                <span>G</span>
                Log in with Google
            </button>


            <p class="signup">
                Don't have an account?
                <a href="#">Sign Up??</a>
            </p>

        </section>

    </main>


<script src="uiwork.js"></script>
</body>
</html>
